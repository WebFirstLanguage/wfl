<!DOCTYPE html>
<html>
<head>
    <title>WFL Static Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .header { color: #007acc; }
    </style>
</head>
<body>
    <h1 class="header">WFL Static File Test</h1>

        document.getElementById('time').textContent = new Date().toLocaleString();
    </script>
</body>
</html>
