name: Auto Format

on:
  push:
    branches: [ main ]

# The auto-commit step pushes formatting fixes back to the branch.
permissions:
  contents: write

jobs:
  auto-format:
    # runs cargo fmt and commits the result - no parallelism to
    # exploit and no x86 artifact produced, so the smallest ARM runner
    # does the same work for a third of the price.
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply rustfmt
        run: cargo fmt --all
      # This workflow pushes directly to the branch, so it must prove hygiene
      # itself immediately before committing (REPOSITORY_HYGIENE.md §8).
      # rustfmt only rewrites tracked Rust sources, so static mode is the
      # relevant gate here.
      - name: Static hygiene check before push
        run: python3 scripts/check_repo_hygiene.py --mode static
      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-format [skip ci]"
