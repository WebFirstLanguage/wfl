name: Auto Format

on:
  push:
    branches: [ main ]

# The auto-commit step pushes formatting fixes back to the branch.
permissions:
  contents: write

jobs:
  auto-format:
    # runs cargo fmt and commits the result - no parallelism to
    # exploit and no x86 artifact produced, so the smallest ARM runner
    # does the same work for a third of the price.
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply rustfmt
        run: cargo fmt --all
      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-format [skip ci]"
