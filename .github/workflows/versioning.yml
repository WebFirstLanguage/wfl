name: Compute Next Version

on:
  workflow_dispatch:  # Manual dry-run only; does not push to main or dev

jobs:
  compute-version:
    # Prints the next YY.M.BUILD from published v-tags. Nightly writes that
    # version into the tree at build time and tags it after a successful
    # publish; this workflow never commits or pushes.
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Compute next version from tags
        run: |
          VERSION="$(python scripts/bump_version.py --from-tags --print)"
          echo "Next version from tags: $VERSION"
