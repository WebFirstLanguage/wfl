name: Nightly Build

on:
  schedule:
    # Run at 05:00 UTC (00:00 AM America/Chicago during DST, 06:00 UTC during standard time)
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      previous_sha:
        description: 'Last successful build SHA (leave empty to compare with last nightly release)'
        required: false
        type: string
      version_override:
        description: 'Override version number (format: YYYY.MM.patch.build)'
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always
  SIGNING_SKIP: true
  CACHE_ON_FAILURE: false
  CARGO_INCREMENTAL: 0

# Default to least-privilege; the release job opts into contents: write.
permissions:
  contents: read

jobs:
  check-for-changes:
    name: Check for changes since last nightly build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      version:      ${{ steps.version.outputs.version }}
      short_sha:    ${{ steps.version.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GitHub CLI
        run: |
          type -p gh >/dev/null || (
            sudo apt update &&
            sudo apt install -y gh
          )

      - name: Authenticate GitHub CLI
        run: echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: Determine last nightly SHA & decide whether to build
        id: check
        shell: bash
        run: |
          ############################
          # 1. Figure out BASE_SHA  #
          ############################
          if [[ -n "${{ inputs.previous_sha }}" ]]; then
            BASE_SHA="${{ inputs.previous_sha }}"
            echo "Using manual baseline SHA: $BASE_SHA"
          else
            # Pick latest tag that starts with 'nightly-'
            LATEST_TAG=$(gh release list --limit 1 --json tagName \
                         --jq '.[] | select(.tagName | test("^nightly-")) .tagName')

            if [[ -n "$LATEST_TAG" ]]; then
              echo "Latest nightly tag: $LATEST_TAG"
              # Use git to resolve the tag to its actual commit SHA
              BASE_SHA=$(git rev-parse "$LATEST_TAG^{}")
            else
              echo "No previous nightly release found."
              BASE_SHA=""
            fi
          fi

          ############################
          # 2. Compare with HEAD     #
          ############################
          HEAD_SHA=$(git rev-parse HEAD)
          echo "HEAD_SHA=$HEAD_SHA"
          echo "BASE_SHA=${BASE_SHA:-<none>}"

          if [[ -z "$BASE_SHA" ]]; then
            echo "First nightly build → will build."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            # --quiet returns exit‑code 1 if there are differences
            if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- . ':!*.md'; then
              echo "No code changes since last nightly."
              echo "should_build=false" >> "$GITHUB_OUTPUT"
            else
              echo "Detected code changes."
              echo "should_build=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Load version from build_meta.json
        id: version
        shell: bash
        run: |
          # Check for version override
          if [[ -n "${{ inputs.version_override }}" ]]; then
            VERSION="${{ inputs.version_override }}"
            echo "Using version override: $VERSION"
          else
            # Read version from .build_meta.json
            YEAR=$(jq -r '.year' .build_meta.json)
            MONTH=$(jq -r '.month' .build_meta.json)
            BUILD=$(jq -r '.build' .build_meta.json)
            VERSION="${YEAR}.${MONTH}.${BUILD}"
            echo "Using version from build_meta.json: $VERSION"
          fi
          
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

# ------------------------------------------------------------
  # BUILD JOB (Windows only)
  # ------------------------------------------------------------
  build:
    name: Build WFL for Windows
    needs: check-for-changes
    if: needs.check-for-changes.outputs.should_build == 'true'
    # 4 -> 8 vCPU. This job has died on its own timeout twice (runs
    # 30190411454, and again after PRs #641/#643 added 26 test files), and a
    # cancelled job never runs its cache-save post step - so each failure left
    # the next nightly equally cold and it timed out again. Compiling 112
    # release-mode test binaries is the one workload that genuinely scales
    # with cores, so doubling them should more than halve wall-clock: ~70min
    # at $0.016/min = $1.12 becomes ~30min at $0.032/min = $0.96. Cheaper AND
    # it breaks the timeout death spiral.
    runs-on: blacksmith-8vcpu-windows-2025
    # `cargo test --release` here compiles EVERY integration test binary in
    # tests/ (112 of them as of 26.7.49) against the full dependency graph, in
    # release mode with `[profile.release] debug = true` — so each one also links
    # a large PDB on the MSVC target. PRs #641/#643 added 26 new test files,
    # which pushed this single step from ~27 min (26.7.47, run 29805777509) to
    # over 70 min without finishing, and the job hit the previous 90-minute cap
    # (run 30190411454, cancelled mid-compile). Because a cancelled job never
    # runs its cache-save post step, the enlarged test binaries never landed in
    # the Swatinem/rust-cache entry, so every following nightly restarted from
    # the same cold state and timed out again. 180 min gives the first post-#641
    # nightly room to finish and repopulate the cache; warm runs stay far below
    # it. Previous bump was 60 -> 90 in PR #618 for the same class of growth.
    timeout-minutes: 180
    env:
      TARGET: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      # ---------- Rust toolchain ----------
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}
          components: rustfmt, clippy

      - name: Cache Cargo registry + target dir
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ env.TARGET }}

      # ---------- Platform‑specific packaging helpers ----------
      - name: Install packaging tools
        run: |
          Write-Host "Installing WiX Toolset..."
          # The package name changed from 'wix' to 'wixtoolset' in Chocolatey
          choco install wixtoolset --no-progress -y

          # Refresh environment to pick up WiX path
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")

          Write-Host "Installing cargo-wix..."
          cargo install cargo-wix@0.3.3 --locked

          # Verify installations
          if (-not ((cargo --list 2>$null) | Select-String -Pattern "wix" -Quiet)) {
            Write-Host "::error::cargo-wix installation failed"
            exit 1
          }

          # Check for WiX installation in common locations
          $wixFound = $false
          $wixPaths = @(
            "${env:ProgramFiles(x86)}\WiX Toolset*",
            "${env:ProgramFiles}\WiX Toolset*",
            "C:\Program Files (x86)\WiX Toolset*",
            "C:\Program Files\WiX Toolset*"
          )
          foreach ($path in $wixPaths) {
            if (Test-Path $path -ErrorAction SilentlyContinue) {
              $wixFound = $true
              Write-Host "WiX Toolset found at: $path"
              break
            }
          }
          if ($env:WIX) {
            $wixFound = $true
            Write-Host "WiX Toolset found via WIX env var: $env:WIX"
          }

          if (-not $wixFound) {
            Write-Host "::error::WiX Toolset installation failed - not found in expected locations"
            exit 1
          }

          Write-Host "Packaging tools installed successfully"

      # ---------- Linting & Format Checking ----------
      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # ---------- Build & test ----------
      - name: Build WFL and LSP
        run: |
          cargo build --release --locked --target ${{ env.TARGET }} --bin wfl
          cargo build --release --locked --target ${{ env.TARGET }} -p wfl-lsp --bin wfl-lsp

      # Copy binaries to target/release/ for integration tests
      # Integration tests expect binaries at target/release/wfl.exe, not target/<target-triple>/release/
      - name: Copy binaries for integration tests
        shell: pwsh
        run: |
          Write-Host "Copying binaries to target/release/ for integration tests..."
          New-Item -ItemType Directory -Force -Path target/release | Out-Null

          $sourcePath = "target/${{ env.TARGET }}/release/wfl.exe"
          $destPath = "target/release/wfl.exe"
          if (Test-Path $sourcePath) {
            Copy-Item $sourcePath -Destination $destPath -Force
            Write-Host "Copied wfl.exe to target/release/"
          } else {
            Write-Host "::error::wfl.exe not found at $sourcePath"
            exit 1
          }

          $lspSourcePath = "target/${{ env.TARGET }}/release/wfl-lsp.exe"
          $lspDestPath = "target/release/wfl-lsp.exe"
          if (Test-Path $lspSourcePath) {
            Copy-Item $lspSourcePath -Destination $lspDestPath -Force
            Write-Host "Copied wfl-lsp.exe to target/release/"
          } else {
            Write-Host "::error::wfl-lsp.exe not found at $lspSourcePath"
            exit 1
          }

      # Ensure a clean test environment
      - name: Clean workspace before tests
        shell: pwsh
        run: |
          if (Test-Path -Path ".wflcfg") {
            Write-Host "Removing .wflcfg before running tests to ensure a clean environment."
            Remove-Item -Path ".wflcfg" -Force
          }

      - name: Run tests
        run: cargo test --release --locked --target ${{ env.TARGET }}

      - name: Run LSP Tests
        run: cargo test -p wfl-lsp --release --locked --target ${{ env.TARGET }} --verbose

      # ---------- Build VS Code Extension ----------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Build VS Code Extension
        working-directory: vscode-extension
        run: |
          npm ci
          npm run vscode:prepublish

      - name: Package VS Code Extension
        working-directory: vscode-extension
        run: |
          npm install -g @vscode/vsce
          vsce package --out vscode-wfl-${{ needs.check-for-changes.outputs.version }}.vsix

      - name: Upload VS Code Extension Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vscode-wfl-${{ needs.check-for-changes.outputs.version }}.vsix
          path: vscode-extension/vscode-wfl-${{ needs.check-for-changes.outputs.version }}.vsix
          if-no-files-found: warn
          # A hand-off to the release job, not an archive: Spaces and the
          # GitHub Release are the durable copies. GitHub's 90-day default
          # retains ~90 nightlies of MSIs and VSIXs on artifact storage, which
          # GitHub bills separately from Blacksmith compute.
          retention-days: 7

      # ---------- Initialize WiX Source Files ----------
      - name: Initialize WiX source files
        run: |
          if (-not (Test-Path "wix")) {
            Write-Host "Generating WiX source files..."
            cargo wix init -p wfl
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::Failed to initialize WiX source files"
              exit 1
            }
          } else {
            Write-Host "WiX source files already exist"
          }

      # ---------- Packaging (Windows) ----------
      - name: Update Version Information
        run: |
          Write-Host "Updating version information..."
          # Check if we have a version override from the workflow input
          if ("${{ inputs.version_override }}" -ne "") {
            # Use the provided version without updating build_meta.json (just update wix.toml)
            python scripts/bump_version.py --skip-bump --update-wix-only --skip-git
          } else {
            # Use the version from build_meta.json without bumping it
            python scripts/bump_version.py --skip-bump --update-all --skip-git
          }
          
          # Output the current version for debugging
          python -c "import json; data = json.load(open('.build_meta.json')); print('Using version: {}.{}.{}'.format(data['year'], data['month'], data['build']))"

      - name: Package WFL
        run: |
          # Create default config file
          Write-Host "Creating default configuration files..."
          New-Item -ItemType Directory -Force -Path target/${{ env.TARGET }}/release/package | Out-Null
          Set-Content -Path "target/${{ env.TARGET }}/release/package/.wflcfg" -Value "timeout_seconds = 60"
          Add-Content -Path "target/${{ env.TARGET }}/release/package/.wflcfg" -Value "logging_enabled = false"
          Add-Content -Path "target/${{ env.TARGET }}/release/package/.wflcfg" -Value "debug_report_enabled = true"
          Add-Content -Path "target/${{ env.TARGET }}/release/package/.wflcfg" -Value "log_level = info"

          # Copy config to root for wix.toml
          Write-Host "Copying configuration to root directory..."
          Copy-Item target/${{ env.TARGET }}/release/package/.wflcfg -Destination .wflcfg

          # Verify binaries exist
          Write-Host "Verifying binaries exist..."
          $binaryPath = "target/${{ env.TARGET }}/release/wfl.exe"
          $lspPath = "target/${{ env.TARGET }}/release/wfl-lsp.exe"
          
          if (-not (Test-Path $binaryPath)) {
            Write-Host "::error::Binary not found at expected path: $binaryPath"
            exit 1
          }
          
          if (-not (Test-Path $lspPath)) {
            Write-Host "::error::LSP binary not found at expected path: $lspPath"
            exit 1
          }

          # Copy binaries to standard release directory for WiX
          Write-Host "Copying binaries to standard release directory for WiX..."
          New-Item -ItemType Directory -Force -Path target/release | Out-Null
          Copy-Item "target/${{ env.TARGET }}/release/wfl.exe" -Destination "target/release/wfl.exe" -Force
          Copy-Item "target/${{ env.TARGET }}/release/wfl-lsp.exe" -Destination "target/release/wfl-lsp.exe" -Force
          
          # Verify copies
          if (Test-Path "target/release/wfl.exe") {
            Write-Host "✓ wfl.exe copied to target/release/"
          } else {
            Write-Host "::error::Failed to copy wfl.exe to target/release/"
            exit 1
          }
          
          if (Test-Path "target/release/wfl-lsp.exe") {
            Write-Host "✓ wfl-lsp.exe copied to target/release/"
          } else {
            Write-Host "::error::Failed to copy wfl-lsp.exe to target/release/"
            exit 1
          }

          # Build MSI with cargo-wix (no --define parameter needed as version is in wix.toml)
          Write-Host "Building MSI installer..."
          cargo wix --no-build --nocapture `
            --output "target/${{ env.TARGET }}/release/wfl-${{ needs.check-for-changes.outputs.version }}.msi" `
            -p wfl

      # ---------- Verify MSI Created Successfully ----------
      - name: Verify installer was created
        run: |
          $msiPath = "target/${{ env.TARGET }}/release/wfl-${{ needs.check-for-changes.outputs.version }}.msi"
          if (-not (Test-Path $msiPath)) {
            Write-Host "::error::MSI installer not found at expected path: $msiPath"
            exit 1
          }
          $msiInfo = Get-Item $msiPath
          Write-Host "MSI created successfully: $($msiInfo.Name), Size: $($msiInfo.Length) bytes"

      # ---------- Smoke tests ----------
      - name: Smoke test installer
        shell: pwsh
        run: |
          try {
            $msiPath = "target\${{ env.TARGET }}\release\wfl-${{ needs.check-for-changes.outputs.version }}.msi"
            Write-Host "Installing MSI from: $msiPath"

            # Use Start-Process with -PassThru to get the process object and check exit code
            $process = Start-Process msiexec.exe -Wait -PassThru -ArgumentList "/i", "`"$msiPath`"", "/qn", "/l*v", "msi_install.log"

            if ($process.ExitCode -ne 0) {
              Write-Host "::error::MSI installation failed with exit code $($process.ExitCode)"
              if (Test-Path "msi_install.log") {
                Write-Host "MSI install log (last 50 lines):"
                Get-Content "msi_install.log" -Tail 50
              }
              exit 1
            }

            Write-Host "MSI installation completed successfully"

            # Verify installed binaries exist
            $wflPath = "$env:ProgramFiles\WFL\bin\wfl.exe"
            $lspPath = "$env:ProgramFiles\WFL\bin\wfl-lsp.exe"

            if (-not (Test-Path $wflPath)) {
              Write-Host "::error::wfl.exe not found at expected install location: $wflPath"
              exit 1
            }

            if (-not (Test-Path $lspPath)) {
              Write-Host "::error::wfl-lsp.exe not found at expected install location: $lspPath"
              exit 1
            }

            $wflVersion = & $wflPath --version
            Write-Host "WFL version: $wflVersion"

            $lspVersion = & $lspPath --version
            Write-Host "WFL-LSP version: $lspVersion"

            Write-Host "Smoke test passed successfully"
          } catch {
            Write-Host "::error::Smoke test failed: $_"
            exit 1
          }

      # ---------- Upload artifacts ----------
      - uses: actions/upload-artifact@v4
        with:
          name: wfl-${{ needs.check-for-changes.outputs.version }}.msi
          path: target/${{ env.TARGET }}/release/wfl-${{ needs.check-for-changes.outputs.version }}.msi
          if-no-files-found: error
          retention-days: 7
  # ------------------------------------------------------------
  # BUILD JOB (Linux, statically linked against musl)
  # ------------------------------------------------------------
  # Runs in parallel with the Windows leg. This produces the artifact that until
  # now was built by hand on the wflbuild.starnet droplet, with one deliberate
  # change: the target is musl, not glibc. The old glibc build IS wfl#616 - it
  # links against glibc 2.39 from Ubuntu 24.04 and refuses to run on Debian 12
  # or Ubuntu 22.04. A static musl binary has no libc floor at all.
  build-linux:
    name: Build WFL for Linux (static musl)
    needs: check-for-changes
    if: needs.check-for-changes.outputs.should_build == 'true'
    # Rust release codegen genuinely scales with cores, so this is one of the
    # few places a bigger runner pays for itself instead of idling.
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 60
    env:
      TARGET: x86_64-unknown-linux-musl
      CC_x86_64_unknown_linux_musl: musl-gcc
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      # Matches the BUILD_INFO the old wflbuild tarballs carried: no debug
      # symbols in the shipped artifact. Also keeps target/ far below the ~30 GB
      # ceiling CLAUDE.md warns about, so no disk-space dance is needed here.
      CARGO_PROFILE_RELEASE_DEBUG: false
    steps:
      - uses: actions/checkout@v4

      # cmake and clang are for aws-lc-sys, which reqwest 0.13 pulls in and
      # which compiles C and assembly. It is the only dependency in the graph
      # with a musl story to get wrong - there is no openssl-sys anywhere here
      # (TLS is rustls end to end), so the usual musl blocker does not apply.
      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools musl-dev cmake clang

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Cache Cargo registry + target dir
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: x86_64-unknown-linux-musl
          # Only main writes the cache, so PR runs cannot race each other to
          # overwrite it with a partial target dir.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Both binaries, matching the Windows MSI, which has always shipped wfl
      # and wfl-lsp together. The Linux tarball previously carried only wfl, so
      # editor support was Windows-only by accident of packaging.
      - name: Build wfl and wfl-lsp
        run: |
          cargo build --release --locked --target "$TARGET" --bin wfl
          cargo build --release --locked --target "$TARGET" -p wfl-lsp --bin wfl-lsp

      # A musl *target* does not guarantee a static *binary* - one stray dynamic
      # dependency silently reintroduces the libc floor while the job still goes
      # green. Assert the property we actually promise, for BOTH binaries.
      #
      # The authoritative test is the ABSENCE of a PT_INTERP program header: a
      # binary that names no interpreter cannot be asking a loader for libc at
      # startup. Do not match on `file` output - Rust's musl target emits a
      # static-PIE, which `file` describes as "static-pie linked" rather than
      # "statically linked", so grepping for the latter reports a perfectly
      # static binary as broken.
      - name: Assert the binaries are statically linked
        run: |
          for b in wfl wfl-lsp; do
            BIN="target/$TARGET/release/$b"
            file "$BIN"
            if readelf -l "$BIN" | grep -q "Requesting program interpreter"; then
              echo "::error::$BIN has a PT_INTERP segment - it is dynamically linked and wfl#616 would reappear"
              readelf -l "$BIN" | grep -A1 INTERP
              exit 1
            fi
            echo "  $b: no PT_INTERP segment - statically linked"
          done

      - name: Smoke test
        run: |
          BIN="$PWD/target/$TARGET/release/wfl"
          "$BIN" --version
          "$PWD/target/$TARGET/release/wfl-lsp" --version
          "$BIN" TestPrograms/basic_syntax_comprehensive.wfl

      - name: Package tarball
        env:
          VERSION:   ${{ needs.check-for-changes.outputs.version }}
          SHORT_SHA: ${{ needs.check-for-changes.outputs.short_sha }}
        run: |
          set -euo pipefail
          # Superset of the tarballs already in the Spaces bucket: the existing
          # wfl-<version>-linux-x86_64/{wfl,README.md,LICENSE,BUILD_INFO} layout
          # is preserved exactly, with wfl-lsp added alongside. Anything already
          # installing from that URL keeps working unchanged.
          DIR="wfl-${VERSION}-linux-x86_64"
          mkdir -p "dist/$DIR"
          cp "target/$TARGET/release/wfl"     "dist/$DIR/wfl"
          cp "target/$TARGET/release/wfl-lsp" "dist/$DIR/wfl-lsp"
          strip "dist/$DIR/wfl" "dist/$DIR/wfl-lsp"
          cp README.md LICENSE "dist/$DIR/"
          cat > "dist/$DIR/BUILD_INFO" <<EOF
          wfl ${VERSION}
          commit:   ${{ github.sha }}
          branch:   ${{ github.ref_name }}
          built:    $(date -u +%Y-%m-%dT%H:%M:%S+00:00)
          builder:  GitHub Actions / Blacksmith (x86_64-unknown-linux-musl)
          rustc:    $(rustc --version)
          contents: wfl, wfl-lsp
          note:     statically linked against musl - no glibc floor (wfl#616)
          EOF
          tar czf "dist/${DIR}-${SHORT_SHA}.tar.gz" -C dist "$DIR"
          ls -la "dist/${DIR}-${SHORT_SHA}.tar.gz"

      # The real boundary test, not a proxy for it, and it runs *after* packaging
      # on purpose: the thing a user installs is the extracted tarball, not the
      # build output it was copied from. Verifying the pre-package binaries would
      # leave `strip` and the tar round-trip untested on the only distro this
      # gate exists for. Debian 12 is exactly where the glibc build failed in
      # issue #616.
      #
      # The full TestPrograms suite still runs on the host runner (ci.yml); what
      # is unique here is the old-glibc distro, so this runs the same
      # comprehensive program the host smoke test does, from the shipped tarball.
      - name: Prove portability on Debian 12 (wfl#616 regression gate)
        env:
          VERSION:   ${{ needs.check-for-changes.outputs.version }}
          SHORT_SHA: ${{ needs.check-for-changes.outputs.short_sha }}
        run: |
          set -euo pipefail
          docker run --rm \
            -e TARBALL="wfl-${VERSION}-linux-x86_64-${SHORT_SHA}.tar.gz" \
            -v "$PWD/dist:/dist:ro" \
            -v "$PWD/TestPrograms:/TestPrograms:ro" \
            debian:12-slim sh -euc '
              cat /etc/debian_version
              cd /tmp
              tar xzf "/dist/$TARBALL"
              cd wfl-*-linux-x86_64
              ls -la
              ./wfl --version
              ./wfl-lsp --version
              ./wfl /TestPrograms/basic_syntax_comprehensive.wfl
            '

      - uses: actions/upload-artifact@v4
        with:
          name: wfl-${{ needs.check-for-changes.outputs.version }}-linux-x86_64.tar.gz
          path: dist/wfl-${{ needs.check-for-changes.outputs.version }}-linux-x86_64-${{ needs.check-for-changes.outputs.short_sha }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  # ------------------------------------------------------------
  # RELEASE JOB
  # ------------------------------------------------------------
  release:
    name: Create or Update Nightly Release
    needs: [check-for-changes, build, build-linux]
    if: needs.check-for-changes.outputs.should_build == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install GitHub CLI
        run: sudo apt-get update && sudo apt-get install -y gh

      - name: Authenticate GitHub CLI
        run: echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Verify artifacts
        run: |
          echo "Verifying downloaded artifacts..."
          echo "MSI artifacts:"
          find artifacts -type f -name "*.msi" -exec ls -la {} \;
          echo "VSIX artifacts:"
          find artifacts -type f -name "*.vsix" -exec ls -la {} \;
          echo "Linux tarballs:"
          find artifacts -type f -name "*.tar.gz" -exec ls -la {} \;

          if [ $(find artifacts -type f -name "*.tar.gz" | wc -l) -eq 0 ]; then
            echo "::error::No Linux tarball found in downloaded artifacts directory"
            exit 1
          fi

          if [ $(find artifacts -type f -name "*.msi" | wc -l) -eq 0 ]; then
            echo "::error::No MSI artifacts found in downloaded artifacts directory"
            exit 1
          fi

          if [ $(find artifacts -type f -name "*.vsix" | wc -l) -eq 0 ]; then
            echo "::warning::No VSIX artifacts found in downloaded artifacts directory"
          fi

      # Spaces is the canonical download location; the GitHub Release below is a
      # mirror, so the canonical publish goes first.
      #
      # It also has to go first for retry reasons: the nightly tag and release
      # ARE the success marker that check-for-changes reads. If the tag existed
      # and this step failed, the next scheduled run would resolve that tag to
      # the current commit, set should_build=false, and never retry the publish -
      # the rolling downloads would stay stale until an unrelated code commit
      # landed. Failing before the tag is written keeps the run retryable.
      #
      # publish_spaces.sh is itself ordered so a partial failure cannot leave the
      # bucket describing a mixed release (immutable objects first, rolling
      # pointers and metadata only after every upload succeeds).
      - name: Publish artifacts to DigitalOcean Spaces
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.SPACES_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          SPACES_BUCKET:         wfl
          SPACES_ENDPOINT:       https://nyc3.digitaloceanspaces.com
          AWS_DEFAULT_REGION:    nyc3
        run: |
          ./scripts/publish_spaces.sh \
            artifacts \
            "${{ needs.check-for-changes.outputs.version }}" \
            "${{ needs.check-for-changes.outputs.short_sha }}" \
            "${{ github.sha }}" \
            "${{ github.ref_name }}"

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Tag commit for nightly
        run: |
          DATE=$(date +'%Y-%m-%d')
          TAG="nightly-${DATE}"
          SHA=$(git rev-parse HEAD)

          # This repository has GitHub immutable releases enabled, so the tag of a
          # published release is permanently protected: pushing a delete is refused
          # with "GH013 ... Cannot delete this tag". The previous
          # delete-then-recreate flow swallowed that refusal as a warning and then
          # died on "tag already exists", failing the whole release job on any run
          # that happened after a release already existed for the same date -- a
          # manual re-dispatch on a day the scheduled nightly had already
          # published, for instance -- even with every build job green.
          # Tagging is idempotent now and never fails on an already-published tag.
          REFS=$(git ls-remote --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}" || true)

          if [ -z "$REFS" ]; then
            echo "No existing remote tag $TAG; creating it at $SHA."
            git tag -f -a "$TAG" -m "Nightly build $DATE"
            git push origin "refs/tags/$TAG"
            exit 0
          fi

          # An annotated tag reports the tag object on the plain line and the
          # commit it points at on the "^{}" line; prefer the latter.
          TAGGED=$(printf '%s\n' "$REFS" | awk '$2 ~ /\^\{\}$/ { print $1 }' | head -n 1)
          if [ -z "$TAGGED" ]; then
            TAGGED=$(printf '%s\n' "$REFS" | awk 'NR == 1 { print $1 }')
          fi

          if [ "$TAGGED" = "$SHA" ]; then
            echo "Tag $TAG already points at $SHA; nothing to do."
            exit 0
          fi

          echo "::warning::Tag $TAG already exists at $TAGGED but this build is $SHA; attempting to move it."
          git tag -f -a "$TAG" -m "Nightly build $DATE"
          if git push --force origin "refs/tags/$TAG"; then
            echo "Moved $TAG to $SHA."
          else
            echo "::warning::Could not move $TAG; it is protected by an immutable release. Leaving the published tag at $TAGGED."
          fi

      - name: Publish or update nightly release
        env:
          VERSION:   ${{ needs.check-for-changes.outputs.version }}
          SHORT_SHA: ${{ needs.check-for-changes.outputs.short_sha }}
        run: |
          TAG="nightly-$(date +'%Y-%m-%d')"

          # Collect all artifact files to upload with the release
          # GitHub's immutable releases require assets to be attached during creation
          MSI_FILES=$(find artifacts -type f -name "*.msi")
          VSIX_FILES=$(find artifacts -type f -name "*.vsix")
          TARBALL_FILES=$(find artifacts -type f -name "*.tar.gz")

          # Build the list of files to attach and validate them
          ASSET_FILES=""
          for f in $MSI_FILES $VSIX_FILES $TARBALL_FILES; do
            if [ ! -s "$f" ]; then
              echo "::error::Empty or corrupted file: $f"
              exit 1
            fi
            ASSET_FILES="$ASSET_FILES $f"
          done

          if [ -z "$ASSET_FILES" ]; then
            echo "::error::No artifact files found to upload"
            exit 1
          fi

          echo "Files to upload: $ASSET_FILES"
          echo "Number of files: $(echo $ASSET_FILES | wc -w)"

          # An immutable release cannot be deleted or edited once published, so the
          # old unconditional "delete, then create" could not refresh one: the
          # delete was silently discarded by "|| true" and the create then failed
          # because the release already existed. Only replace a release that is
          # still mutable.
          RELEASE_ID=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" -q '.id' 2>/dev/null || true)
          if [ -n "$RELEASE_ID" ]; then
            IMMUTABLE=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" -q '.immutable' 2>/dev/null || true)
            if [ "$IMMUTABLE" = "true" ]; then
              echo "::warning::Release $TAG is already published and immutable, so it cannot be replaced. Skipping the GitHub release step; this run's artifacts are on DigitalOcean Spaces, which the release notes already name as the canonical download location."
              exit 0
            fi
            echo "Replacing the existing (mutable) release $TAG."
            gh release delete "$TAG" --yes 2>/dev/null || true
          fi

          # Create release with assets attached in a single command
          # This works with immutable releases since assets are part of the creation
          gh release create "$TAG" \
            --title "WFL Nightly Build $(date +'%Y-%m-%d')" \
            --notes "⚠️ Installers are **unsigned** test builds – do not use in production.

          Version: $VERSION
          Commit:  ${{ github.sha }}

          ## Downloads
          - **wfl-${VERSION}.msi** - Windows MSI installer (includes WFL, WFL-LSP, and VS Code extension)
          - **wfl-${VERSION}-linux-x86_64-${SHORT_SHA}.tar.gz** - Linux x86_64 (includes WFL and WFL-LSP), statically linked against musl so it has no glibc requirement
          - **vscode-wfl-${VERSION}.vsix** - VS Code extension (standalone installation)

          Canonical, CDN-backed downloads: <https://wfl.nyc3.cdn.digitaloceanspaces.com/releases/>" \
            --prerelease \
            $ASSET_FILES

          echo "Release created successfully: $TAG with $(echo $ASSET_FILES | wc -w) assets"
