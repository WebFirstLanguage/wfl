name: WFL Config Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  config-lint:
    # Does a full `cargo build` plus three `cargo run` invocations, so this is a
    # real compile, not a lint - keep 4 cores. ARM is still 37.5% cheaper at
    # the same core count, and nothing here produces an x86 artifact.
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
    
    - name: Build
      run: cargo build --verbose
    
    - name: Run config check
      run: cargo run -- --configCheck
      
    - name: Run config fix
      run: cargo run -- --configFix
      
    - name: Verify clean state after fix
      run: cargo run -- --configCheck
